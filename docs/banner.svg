<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 480" width="1280" height="480">
  <defs>
    <radialGradient id="glow" cx="78%" cy="20%" r="80%">
      <stop offset="0%" stop-color="#0A84FF" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#0A84FF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="iconBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1F9BFF"/>
      <stop offset="100%" stop-color="#0070E8"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1C1C1E"/>
      <stop offset="100%" stop-color="#151517"/>
    </linearGradient>
    <linearGradient id="thumb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3A3A3C"/>
      <stop offset="100%" stop-color="#2C2C2E"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="480" fill="#000000"/>
  <rect width="1280" height="480" fill="url(#glow)"/>

  <!-- Wordmark -->
  <rect x="80" y="120" width="150" height="150" rx="34" fill="url(#iconBg)"/>
  <path d="M107 160 L128.5 240 L147 178 L165.5 240 L187 178 L208.5 240 L230 160" fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="230" cy="160" r="7" fill="#64D2FF"/>
  <text x="80" y="375" font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="88" font-weight="800" fill="#FFFFFF" letter-spacing="-2">Wire</text>
  <text x="80" y="425" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="500" fill="#98989F">The whole web. One quiet feed.</text>

  <!-- Phone mockup -->
  <g transform="translate(700,38)">
    <rect width="290" height="404" rx="44" fill="#0D0D0F" stroke="#2C2C2E" stroke-width="2"/>
    <rect x="12" y="12" width="266" height="380" rx="34" fill="#000000"/>
    <rect x="112" y="22" width="66" height="18" rx="9" fill="#0D0D0F"/>

    <!-- Nav bar -->
    <rect x="12" y="48" width="266" height="26" fill="#000000"/>
    <text x="30" y="66" font-family="-apple-system, 'SF Pro Text', Arial" font-size="12" font-weight="700" fill="#FFFFFF">Wire</text>
    <rect x="238" y="56" width="18" height="12" rx="6" fill="#0A84FF"/>

    <!-- Large title -->
    <text x="30" y="96" font-family="-apple-system, 'SF Pro Display', Arial" font-size="19" font-weight="800" fill="#FFFFFF">Today</text>

    <!-- Category chips -->
    <rect x="28" y="106" width="52" height="13" rx="6.5" fill="#0A84FF"/>
    <rect x="86" y="106" width="52" height="13" rx="6.5" fill="#1C1C1E"/>
    <rect x="144" y="106" width="52" height="13" rx="6.5" fill="#1C1C1E"/>

    <!-- Card 1 -->
    <rect x="26" y="130" width="238" height="72" rx="14" fill="url(#cardBg)"/>
    <circle cx="44" cy="146" r="4" fill="#0A84FF"/>
    <rect x="52" y="142" width="58" height="7" rx="3.5" fill="#636366"/>
    <rect x="38" y="156" width="150" height="8" rx="4" fill="#E5E5EA"/>
    <rect x="38" y="170" width="112" height="8" rx="4" fill="#E5E5EA"/>
    <rect x="38" y="184" width="76" height="6" rx="3" fill="#636366"/>
    <rect x="204" y="150" width="42" height="42" rx="9" fill="url(#thumb)"/>

    <!-- Card 2 -->
    <rect x="26" y="212" width="238" height="72" rx="14" fill="url(#cardBg)"/>
    <circle cx="44" cy="228" r="4" fill="#FF9F0A"/>
    <rect x="52" y="224" width="64" height="7" rx="3.5" fill="#636366"/>
    <rect x="38" y="238" width="160" height="8" rx="4" fill="#E5E5EA"/>
    <rect x="38" y="252" width="124" height="8" rx="4" fill="#E5E5EA"/>
    <rect x="38" y="266" width="70" height="6" rx="3" fill="#636366"/>
    <rect x="204" y="232" width="42" height="42" rx="9" fill="url(#thumb)"/>

    <!-- Card 3 (partial) -->
    <rect x="26" y="294" width="238" height="60" rx="14" fill="url(#cardBg)" opacity="0.75"/>

    <!-- Tab bar -->
    <rect x="12" y="352" width="266" height="40" rx="0" fill="#111113"/>
    <rect x="12" y="352" width="266" height="0.75" fill="#2C2C2E"/>
    <circle cx="60" cy="368" r="5" fill="#0A84FF"/>
    <circle cx="135" cy="368" r="5" fill="#636366"/>
    <circle cx="210" cy="368" r="5" fill="#636366"/>
    <rect x="46" y="379" width="28" height="5" rx="2.5" fill="#0A84FF"/>
    <rect x="121" y="379" width="28" height="5" rx="2.5" fill="#636366"/>
    <rect x="196" y="379" width="28" height="5" rx="2.5" fill="#636366"/>
  </g>
</svg>
