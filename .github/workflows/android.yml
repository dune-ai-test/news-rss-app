name: Android CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # needed only for the tag-release job

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make wrapper executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: wire-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish Release (tags only)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: wire-debug-apk

      - name: Rename APK
        run: mv app-debug.apk "Wire-${GITHUB_REF_NAME}.apk"

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          files: Wire-${{ github.ref_name }}.apk
          generate_release_notes: true
          body: |
            ## Wire ${{ github.ref_name }}

            Download **Wire-${{ github.ref_name }}.apk** below and sideload it on any Android 8.0+ device.

            This is a debug build signed with the Android debug key — perfect for trying Wire out.
