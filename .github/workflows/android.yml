name: Android CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make wrapper executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      # ---------- Rolling release on main (this is how the APK ships) ----------
      - name: Move `latest` tag to this commit
        if: github.ref == 'refs/heads/main'
        run: |
          git tag -f latest
          git push -f origin latest

      - name: Rename APK for rolling release
        if: github.ref == 'refs/heads/main'
        run: cp app/build/outputs/apk/debug/app-debug.apk Wire-latest.apk

      - name: Publish "Wire — Latest build" rolling release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Wire — Latest build (main)"
          target_commitish: ${{ github.sha }}
          prerelease: true
          overwrite_files: true
          body: |
            🤖 Automated **debug** build of Wire from `main` @ `${{ github.sha }}`.

            ### Install
            1. Download **Wire-latest.apk** below
            2. On your Android phone enable *Install unknown apps* for your browser/file manager
            3. Open the APK and install

            _Debug-signed, for trying Wire out. Versioned, stable-ish drops live under tagged releases (v*)._
          files: Wire-latest.apk

      # ---------- Versioned releases on v* tags ----------
      - name: Rename APK for tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        run: cp app/build/outputs/apk/debug/app-debug.apk "Wire-${GITHUB_REF_NAME}.apk"

      - name: Publish versioned release with APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Wire-${{ github.ref_name }}.apk
          generate_release_notes: true
          overwrite_files: true
          body: |
            ## Wire ${{ github.ref_name }}

            Download **Wire-${{ github.ref_name }}.apk** below and sideload it on any Android 8.0+ device.

            This is a debug build signed with the Android debug key — for trying Wire out.
